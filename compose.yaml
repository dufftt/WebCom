# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  customer-subgraph:
    build:
      context: ./customer_service
    container_name: customer_dev_subgraph
    ports:
      - 8081:8081
    volumes:
      - ./customer_service:/app
      - ~/.m2:/root/.m2
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/customer_db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - postgres
      - redis
  product-subgraph:
    build:
      context: ./product_service
    container_name: product_dev_subgraph
    ports:
      - 8082:8082
    volumes:
      - ./product_service:/app
      - ~/.m2:/root/.m2
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product_db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - postgres
      - redis
  order-subgraph:
    build:
      context: ./order_service
    container_name: order_dev_subgraph
    ports:
      - 8083:8083
    volumes:
      - ./order_service:/app
      - ~/.m2:/root/.m2
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order_db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - postgres
      - redis
  shipping-subgraph:
    build:
      context: ./shipping_service
    container_name: shipping_dev_subgraph
    ports:
      - 8084:8084
    volumes:
      - ./shipping_service:/app
      - ~/.m2:/root/.m2
    environment:
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shipping_db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - postgres
      - redis
  payment-subgraph:
    build:
      context: ./payment_service
    container_name: payment_dev_subgraph
    ports:
      - 8085:8085
    volumes:
      - ./payment_service:/app
      - ~/.m2:/root/.m2
    environment:
      - SERVER_PORT=8085
      - RAZOR_KEY_ID=<sample key>
      - RAZOR_KEY_SECRET=<sample secret>

  api-gateway:
    build:
      context: ./api_gateway
    container_name: api_dev_subgraph
    ports:
      - 8089:8089
    volumes:
      - ./api_gateway:/app
      - ~/.m2:/root/.m2
    environment:
      - SERVER_PORT=8086
      - CUSTOMER_SERVICE_URL=http://customer-subgraph:8081
      - PRODUCT_SERVICE_URL=http://product-subgraph:8082
      - ORDER_SERVICE_URL=http://order-subgraph:8083
      - PAYMENT_SERVICE_URL=http://payment-subgraph:8085
      - SHIPPING_SERVICE_URL=http://shipping-subgraph:8084
    depends_on:
      - customer-subgraph
      - product-subgraph
      - order-subgraph
      - shipping-subgraph
      - payment-subgraph

  postgres:
    image: postgres:15-alpine
    container_name: postgres-dev
    environment:

      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      
  # 3. ADD NEW SERVICES HERE (REDIS)
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379" # Exposes 6379 to your laptop for GUI tools like RedisInsight
    volumes:
      - redisdata:/data # Persists your cache data even if the container stops
    command: redis-server --appendonly yes # Enables safe data serialization

volumes:
  pgdata:
  redisdata:
