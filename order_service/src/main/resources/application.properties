spring.application.name=order-service

# POSTGRESSSQL (dev) datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate (dev)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# REDIS CORE CONNECTION PROPERTIES
# Format -> ${ENVIRONMENT_VARIABLE_NAME:fallback_value_if_not_in_docker}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# OPTIONAL: LETTUCE SPECIFIC TUNING CONFIGURATIONS
# Configures connection timeout threshold (e.g., 5000 milliseconds)
spring.data.redis.timeout=5000ms

# Configures Lettuce Connection Pool Metrics
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0



management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# allow schema/data initialization from schema.sql / data.sql
spring.sql.init.mode=always

server.port=${SERVER_PORT}



# graphql
spring.graphql.http.path=/graphql
# enabling graphiql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/igraphql
spring.graphql.cors.allowed-origin-patterns=*